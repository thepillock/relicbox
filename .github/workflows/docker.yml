# Builds the RelicBox image and pushes it to GitHub Container Registry.
#
#   push to main          -> ghcr.io/thepillock/relicbox:test   (test track)
#   push a tag v1.2.3     -> ghcr.io/thepillock/relicbox:latest  (stable track)
#                            plus :1.2.3 and :1.2 for pinning / rollback
#
# Unraid watches the tag each container uses and shows "update available"
# when a new image is pushed to it.
name: Build image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/relicbox

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Smoke test
        run: |
          pip install -r requirements.txt
          python tests/smoke.py

      - name: Work out channel and version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "channel=test" >> "$GITHUB_OUTPUT"
            echo "version=test-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=test,enable=${{ steps.ver.outputs.channel == 'test' }}
            type=sha,prefix=test-,format=short,enable=${{ steps.ver.outputs.channel == 'test' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.channel == 'stable' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_CHANNEL=${{ steps.ver.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
