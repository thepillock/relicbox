<dialog id="scan-dialog" class="scan-dialog">
  <div class="scanner">
    <video id="dlg-video" playsinline muted></video>
    <div class="scan-frame"></div>
    <p class="scan-status" id="dlg-status"></p>
  </div>
  <div class="actions">
    <label class="btn">📷 Scan a photo<input type="file" accept="image/*" capture="environment" hidden id="dlg-photo"></label>
    <button type="button" class="btn" id="dlg-close">Cancel</button>
  </div>
</dialog>
<script src="{{ url_for('static', filename='vendor/zxing.min.js') }}" onerror="void 0"></script>
<script src="{{ url_for('static', filename='scanner.js') }}"></script>
<script>
(function () {
  const dlg = document.getElementById('scan-dialog');
  let target = null;
  document.querySelectorAll('[data-scan-into]').forEach(btn => btn.addEventListener('click', () => {
    target = document.getElementById(btn.dataset.scanInto);
    dlg.showModal();
    Scanner.start(document.getElementById('dlg-video'), document.getElementById('dlg-status'), code => {
      target.value = code; Scanner.stop(); dlg.close();
    });
  }));
  document.getElementById('dlg-close').addEventListener('click', () => { Scanner.stop(); dlg.close(); });
  document.getElementById('dlg-photo').addEventListener('change', async e => {
    const f = e.target.files[0], st = document.getElementById('dlg-status');
    if (!f) return;
    st.textContent = 'Reading…';
    const code = await Scanner.fromFile(f);
    e.target.value = '';
    if (code) { target.value = code; Scanner.stop(); dlg.close(); }
    else st.textContent = "Couldn't find a code in that photo. Try again closer.";
  });
  dlg.addEventListener('close', () => Scanner.stop());
})();
</script>
